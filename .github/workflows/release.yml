# Push a tag like v1.1.0 and this builds the zip and attaches it to a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} doesn't match manifest version $v"; exit 1; }
      - name: Build zip
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "ApplyFill ${GITHUB_REF_NAME}" --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md)
