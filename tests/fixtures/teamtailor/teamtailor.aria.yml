  - heading "Workplace & Culture" [level=2]
  - paragraph:
    - text: Our guiding stars are to be
    - strong: different
    - text: ","
    - strong: personal
    - text: and
    - strong: kind
    - text: . These apply to everything we do, from how we talk to our customers to how we work and who we hire. We have a lot of fun doing what we love, and we celebrate every success.
  - paragraph: Drop by one of our offices and say hello and meet our team – coffee is on us ☕️
  - heading "About Teamtailor" [level=2]
  - paragraph: Teamtailor is a tech company specialized in hiring. We believe the right hire can change everything, and that giving hiring people the right technology is one of the most powerful ways to make that happen. Used by more than 13,000 companies around the world, Teamtailor helps hiring teams attract, engage and hire the right people while taking more of the work around hiring off their plate – making every hire count.
  - text: Founded in 2013 Co-workers 500+
