- main:
  - text: Sales · London · Hybrid
  - heading "UK Account Executive - SMB" [level=1]
  - heading "This is a job that provides a great platform for personal & professional growth, uncapped earning potential and the opportunity to work with a global market leader within the ATS & HR Tech Industry" [level=2]
  - button "Apply for this job"
  - button "Scroll to content"
  - heading "Let's build the future together!" [level=4]
  - paragraph:
    - link "Teamtailor":
      - /url: https://www.teamtailor.com/en/
    - text: is an Employer Branding and an ATS SaaS platform used by over 13,000 companies, 250.000 users in 90 countries around the world.
  - paragraph: Working at Teamtailor means working at a global, international, and fast-paced tech company that offers an ideal workplace for those who want to have a real impact on the growth of an organisation and are craving for responsibilities. It also means having lots of fun!!! 🥳
  - paragraph: Building a diverse team with various backgrounds and expertise is at the core of Teamtailor since its very beginning, and is truly a part of our strength today! There are no typical profiles, except that every team member shares our vision and wants to be part of our success. Join us in our mission to help companies and people interact with each other in a better way so that they can make life-changing decisions together.
  - paragraph:
    - text: We are now looking for an
    - strong: Account Executive
    - text: to join the team from our
    - strong: Farringdon office
    - text: "- this role is perfect for someone who thrives on ownership, moves fast, and loves building their own book of business!"
  - paragraph:
    - text: We work hard and have lots of fun along the way, but every call counts, and we're looking for someone who takes
    - strong: real accountability for their numbers and stays proactive
    - text: about hitting them, not just aiming for them. You will be instrumental in driving Teamtailor's growth across the
    - strong: SMB+Mid-Market
    - text: segment, running
    - strong: high-velocity sales cycles
    - text: from first contact through to close.
  - heading "Key Responsibilities:" [level=4]
  - list:
    - listitem:
      - paragraph:
        - text: Take
        - strong: full ownership and accountability
        - text: of your pipeline and your numbers, treating every call and every deal as if it's the one that matters most
    - listitem:
      - paragraph:
        - strong: Build and nurture
        - text: your own book of business through proactive, self-generated, multi-channel outreach, never waiting for pipeline to come to you
    - listitem:
      - paragraph:
        - text: Run structured, consultative discovery and
        - strong: use MEDDPICC
        - text: diligently to qualify every opportunity
    - listitem:
      - paragraph:
        - text: Manage a
        - strong: high volume of fast-moving deals
        - text: with a high degree of detail and accuracy
    - listitem:
      - paragraph:
        - text: Keep
        - strong: pipeline hygiene and CRM data clean
        - text: ", accurate and up to date at all times, no exceptions"
    - listitem:
      - paragraph:
        - text: Deliver
        - strong: compelling product demonstrations
        - text: tailored to each prospect's needs
    - listitem:
      - paragraph:
        - strong: Collaborate closely with Customer Success
        - text: and the wider Sales team to ensure smooth handovers at close
    - listitem:
      - paragraph:
        - text: Provide reliable
        - strong: weekly and monthly forecasts
        - text: you can be held to
    - listitem:
      - paragraph:
        - text: Consistently and proactively hit your monthly and quarterly revenue targets, and
        - strong: take ownership
        - text: when a number is at risk rather than waiting to be asked
    - listitem:
      - paragraph: Bring your experience selling in the tech space to help upskill the wider team
  - heading "We are looking for someone with:" [level=4]
  - list:
    - listitem:
      - paragraph:
        - text: A track record of selling in the tech space, ideally
        - strong: SaaS,
        - text: with a genuine passion for sharing that knowledge with the team
    - listitem:
      - paragraph:
        - text: Experience working in a
        - strong: high-performance, target-driven sales culture,
        - text: where you're comfortable being held to your numbers
    - listitem:
      - paragraph:
        - text: A s
        - strong: trong sense of personal accountability
        - text: and ownership - you treat your pipeline like your own business and don't need to be chased to stay on top of it
    - listitem:
      - paragraph: Genuinely proactive by nature - you spot when a number is slipping and act on it before anyone has to flag it
    - listitem:
      - paragraph: Strong attention to detail, particularly when managing several fast-moving deals at once
    - listitem:
      - paragraph:
        - text: Familiarity with
        - strong: MEDDPICC or a similar qualification framework
    - listitem:
      - paragraph:
        - text: Excellent pipeline hygiene and
        - strong: CRM discipline
        - text: (Salesforce & Gong experience preferred)
    - listitem:
      - paragraph: Emotional intelligence and strong communication skills, with the ability to build genuine relationships with prospects
    - listitem:
      - paragraph:
        - text: An
        - strong: inquisitive, hungry mindset
        - text: "- always looking to improve and develop"
    - listitem:
      - paragraph:
        - text: The ability to
        - strong: take feedback well
        - text: and act on it quickly
    - listitem:
      - paragraph: A team-first attitude, willing to share knowledge and support colleagues
  - heading "What we have to offer:" [level=4]
  - list:
    - listitem:
      - paragraph: The opportunity to sell the market's leading employer branding and recruitment platform
    - listitem:
      - paragraph: Fixed salary together with a variable commission plan, we apply a generous model with no cap
    - listitem:
      - paragraph: Company pension
    - listitem:
      - paragraph: Development opportunities in a fast-growing environment, continuous training, and support
    - listitem:
      - paragraph: Generous PTO (25 days) and you will be able to attend our yearly 3-day company trip
    - listitem:
      - paragraph: Tons of team events, celebrations, monthly competitions and rewards for those who like challenges
    - listitem:
      - paragraph: Starter kit which includes a Macbook Air, iPhone, and the must-have Teamtailor merch, free breakfast and fika
    - listitem:
      - paragraph: The opportunity to work with a talented, fun and kind group of individuals, based in our Farringdon office
  - paragraph: If this sounds like you, then you know what to do!
