- main:
  - text: FCP · Copenhagen, Denmark
  - heading "Team Lead, Ongoing Due Diligence" [level=1]
  - button "Apply for this job"
  - button "Scroll to content"
  - paragraph: Banking is changing, and we're building the bank that's driving that change. Lunar is a Nordic challenger bank, founded in Copenhagen in 2015, with offices in Copenhagen, Aarhus, and Stockholm. We're putting AI at the core of how we build and run the bank, but knowing exactly who we're doing business with still comes down to people, and that's what this team does.
  - paragraph: "The ODD team makes sure Lunar knows who it's doing business with. As Team Lead, you'll run the day-to-day of our ODD specialists, the team digging into ownership structures, source of funds, and risk indicators before and during a customer relationship. This is a people-leadership role first: you're accountable for the team's output and quality, not doing the casework yourself. You'll report to our Director of FCP Operations."
  - paragraph:
    - strong: What will you do?
  - list:
    - listitem:
      - paragraph: Lead the ODD specialist team day-to-day, managing workload, setting priorities, and keeping delivery on track against SLAs.
    - listitem:
      - paragraph: "Own formal performance management for the team: regular reviews, direct feedback, and addressing underperformance early rather than letting it drift."
    - listitem:
      - paragraph: Track SLA and quality metrics closely, so you catch where the team is drifting before it shows up in the numbers.
    - listitem:
      - paragraph: Act as the escalation point for complex or ambiguous cases, including flagging potential regulatory deviations upward before they become disclosures, and make sure the team applies ODD policy and procedure consistently, understanding the regulatory logic, not just the steps.
    - listitem:
      - paragraph: Represent ODD in the wider FCP/Onboarding leadership forum, flagging risks and resourcing needs upward.
  - paragraph:
    - strong: What are we looking for in you?
  - list:
    - listitem:
      - paragraph: Experience leading a team in an operational KYC/AML-adjacent function.
    - listitem:
      - paragraph: Strong people skills, this role is about leading people who lead numbers, not just managing a queue.
    - listitem:
      - paragraph: Solid working knowledge of ODD/EDD practices and the regulatory logic behind them, not just the checklist.
    - listitem:
      - paragraph: "Comfortable with data: you use SLA and quality metrics to catch problems early, not just to report on them after the fact."
    - listitem:
      - paragraph: Fluent in Danish and English. Swedish is an advantage, as we onboard customers in both the Danish and Swedish markets.
  - paragraph:
    - strong: Benefits and perks
  - list:
    - listitem:
      - paragraph: 4 days in the office. We're a team that builds together, thinks together, and moves together. Showing up is part of how we work.
    - listitem:
      - paragraph: State of the art equipment. The newest computer, monitor, mouse, and keyboard. We want you to do your best work without anything slowing you down.
    - listitem:
      - paragraph: Pension, health insurance, and enhanced parental leave. From your financial future to your family moments. We've got you covered.
  - paragraph:
    - strong: Are you ready to join the journey? Apply now and let's find out more!
  - paragraph:
    - emphasis: While you hold on tight for us to get back to you, curious to see what we’re up to? Follow us on
    - link "LinkedIn":
      - /url: https://www.linkedin.com/company/lunarbank/mycompany/?viewAsMember=true
      - emphasis: LinkedIn
    - emphasis: for business announcements and releases 📢, check out our
    - link "Instagram":
      - /url: https://www.instagram.com/lifeatlunar/?hl=enlunar%20blog
      - emphasis: Instagram
    - emphasis: for an inside scoop on what it’s like to work here .
  - paragraph:
    - emphasis: Depending on the regulations in the country where you will be employed, we will ask to see or obtain information about your criminal record.
    - emphasis: Please note that our employment is conditional upon you
    - text: not
    - emphasis: being registered in RKI (Ribers Kredit Information).
  - paragraph:
    - emphasis: We welcome applications from candidates of all backgrounds. If you need any adjustments during the recruitment process, please let us know
