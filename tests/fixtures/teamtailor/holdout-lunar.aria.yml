  - heading "About Lunar" [level=2]
  - paragraph: Lunar is a fully licensed digital bank founded in 2015, with offices in Copenhagen, Aarhus and Stockholm. We're 400+ people building cloud-native, real-time financial services for millions of users across Denmark, Sweden, and Norway.
  - paragraph: Our mission is to pioneer financial empowerment. A world where money works for you, enabling you to live your best life, free from worry. That's what gets us out of bed every day.
  - paragraph: We build on cloud-native infrastructure with modern technologies across our full stack. We hire across Tech, Design, Product, Finance, Marketing, Compliance, and Customer Excellence. No legacy systems. No old habits. Just a better way to build banking across the Nordics.
  - paragraph: It's time to make your move.
