- main:
  - text: Customer Experience · Beesd, Netherlands
  - heading "Head of Customer Engagement Benelux" [level=1]
  - heading "Join Polestar as Head of Customer Engagement Benelux to shape seamless customer journeys, build lasting loyalty, and lead a team creating a premium experience across every touchpoint." [level=2]
  - button "Apply for this job"
  - button "Scroll to content"
  - heading "Let us describe the challenge we offer" [level=3]:
    - strong: Let us describe the challenge we offer
  - paragraph:
    - text: We are looking for an experienced
    - strong: Head of Customer Engagement
    - text: to lead and elevate the customer journey across the Benelux region.
  - paragraph: In this role, you will be responsible for creating a seamless and premium customer experience across all touchpoints, driving customer loyalty, advocacy, and business growth. You will lead the Customer Experience function, translate customer insights into meaningful improvements, and ensure strong alignment between customer needs and business objectives.
  - paragraph: A key part of the role is owning the customer communication framework and CRM strategy across the customer lifecycle. Working closely with Sales and Marketing teams, you will ensure customers receive the right communication through the right channels at the right time, creating a consistent and engaging experience.
  - heading "What you'll do" [level=3]:
    - strong: What you'll do
  - list:
    - listitem:
      - paragraph: Own and continuously improve the end-to-end customer journey across all touchpoints.
    - listitem:
      - paragraph: Lead the Customer Experience operation across the Benelux markets, ensuring premium service delivery and strong operational performance.
    - listitem:
      - paragraph: Drive Voice of the Customer initiatives and translate insights into tangible improvements.
    - listitem:
      - paragraph: Develop customer loyalty, retention, and community engagement strategies.
    - listitem:
      - paragraph: Define and optimize customer communication journeys and CRM programmes across the customer lifecycle.
    - listitem:
      - paragraph: Partner with Sales and Marketing to coordinate customer communications and engagement strategies.
    - listitem:
      - paragraph: Monitor and improve key performance indicators, including customer satisfaction, service levels, employee engagement, and operational efficiency.
    - listitem:
      - paragraph: Lead, coach, and develop a high-performing customer-centric team.
    - listitem:
      - paragraph: Collaborate closely with regional and global stakeholders to deliver a consistent customer experience.
  - paragraph
  - heading "Who you are" [level=3]:
    - strong: Who you are
  - list:
    - listitem:
      - paragraph: Bachelor's or Master's degree in Business, Marketing, Customer Experience, or a related field.
    - listitem:
      - paragraph: Proven leadership experience within Customer Experience, CRM, customer operations, or related customer-facing functions.
    - listitem:
      - paragraph: Strong knowledge of customer journey management, CRM strategy, customer engagement, and lifecycle communication.
    - listitem:
      - paragraph: Experience working with customer data and insights to drive business decisions and improve customer outcomes.
    - listitem:
      - paragraph: Strong stakeholder management skills with the ability to influence across functions and markets.
    - listitem:
      - paragraph: Excellent communication and leadership capabilities in a dynamic, fast-paced environment.
    - listitem:
      - paragraph: Experience within the Automotive Industry is a strong asset.
    - listitem:
      - paragraph: Strong knowledge of Dutch and English is required. As you are responsible for the Benelux region, you will also need to travel regularly to our Polestar office in Belgium (Brussel).
  - paragraph: At Polestar, you will be part of a cross-functional and international team, with English as a natural language for written and spoken communication. Since Polestar’s in a scale-up phase you thrive by working in a fast-paced environment.
  - paragraph
  - heading "People at Polestar" [level=3]:
    - strong: People at Polestar
  - paragraph: We know that a change is needed. We also know that each one of us can help bring about that change. Our commitment to becoming climate-neutral by 2040 is just as important to us as being inclusive, diverse, and innovative. Together, we are creating, collaborating and experimenting to usher in a new era of sustainable mobility.
  - paragraph: We are an electric performance brand, determined to improve the society we live in.
  - paragraph
  - heading "Is this you?" [level=3]:
    - strong: Is this you?
  - paragraph: If you are interested in joining the Polestar crew, don't wait with submitting your application. We apply a continuous selection process and the job post will be open until the position is filled.
  - paragraph: Are you ready for the journey? Which is electric by the way...
