  - heading "Voluntary Self Identification" [level=3]
  - paragraph: For government reporting purposes (EEO-1), we ask candidates to respond to the below self-identification survey. Discord is required to file annual demographic reports with the Equal Employment Opportunity Commission. Your responses help us meet this obligation. Each question below includes an “I don’t wish to answer” option. Whatever your decision, it will not be considered in the hiring process or thereafter. Any information that you do provide will be recorded and maintained in a confidential file.
  - paragraph: Additionally, we also have [optional] questions. These help us understand the composition of our broader applicant pool and have no impact on your application or hiring decisions. Your answers are kept secure, pseudonymized, and separate from your application and personal data. By answering, you consent to our use of your responses for the reasons above. If you change your mind later about sharing this information, you can withdraw consent anytime by reaching out to us at privacy@discordapp.com.
  - paragraph: Discord is an Equal Employment Opportunity employer. We do not discriminate on the basis of race, color, religion, sex (including pregnancy, childbirth, and related medical conditions), gender identity, gender expression, sexual orientation, national origin, ancestry, age, marital status, disability, medical condition, genetic information, military or veteran status, citizenship status, or any other characteristic protected by applicable federal, state, or local law. This policy applies to all aspects of employment, including hiring, promotion, compensation, discipline, termination, and access to benefits and training.
