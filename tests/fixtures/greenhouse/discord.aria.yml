  - heading "Commercial Policy Lead" [level=1]
  - img
  - text: San Francisco Bay Area
  - button "Apply"
  - paragraph:
    - text: "Discord has a highly engaged community of millions of daily active users who use the platform for many different reasons, but there’s one thing that nearly everyone does:"
    - strong: play video games.
    - text: Discord plays a uniquely important role in the future of gaming, and we are focused on making it easier and more fun for people to hang out before, during, and after playing games.
  - paragraph: We are seeking a strategic Commercial Policy Lead to shape Discord's approach to monetization and revenue products. As a key member of the Product Policy organization, you will develop and implement advertising and commerce policies that enable Discord's business while maintaining platform safety and user trust. This role requires a deep understanding of digital commerce, creator economies, and advertising ecosystems, with the ability to balance business objectives with responsible platform practices.
  - paragraph: "Please note: This role involves regular exposure to potentially disturbing content, including violence, hate speech, and other harmful material."
  - paragraph:
    - strong: What you'll be doing
  - list:
    - listitem: Lead policy development for Discord’s ads and/or commerce business. Flex into policy work for Discords other products as needed.
    - listitem: Create frameworks that enable sustainable business growth while protecting users from deceptive practices, fraud, and economic harm.
    - listitem: Partner with Legal and Compliance to ensure policies meet regulatory requirements across global markets.
    - listitem: Develop clear guidelines for acceptable advertising and commerce.
    - listitem: Leverage AI tools and data analytics to identify emerging commercial risks and policy gaps.
    - listitem: Represent Discord externally to key business partners, advertisers and other external industry organizations parties where needed.
    - listitem: Translate complex policy requirements into actionable business guidelines that sales and product teams can implement effectively.
    - listitem: Provide policy guidance to product teams throughout the development lifecycle.
    - listitem: Collaborate with Trust & Safety to ensure commercial policies can be effectively enforced at scale with AI and human review.
  - paragraph:
    - strong: What you should have
  - list:
    - listitem: 5+ years of experience in advertising policy, platform monetization or related roles within technology companies.
    - listitem: "Proven experience with at least two areas: digital advertising, third party data providers, brand safety and suitability, subscription business models or developer APIs/SDKs."
    - listitem: Experience using AI in day-to-day projects and workflows.
    - listitem: Comfort and sound decision-making in ambiguous and evolving situations.
    - listitem: Experience working with revenue teams and understanding business metrics/KPIs.
    - listitem: Strong analytical skills with ability to use data to inform policy decisions.
    - listitem: Excellent communication skills for both technical and business stakeholders.
  - paragraph:
    - emphasis: Candidates must reside in or be willing to relocate to the San Francisco Bay Area (Alameda, Contra Costa, Marin, Napa, San Francisco, San Mateo, Santa Clara, Solano, and Sonoma counties). Relocation assistance may be available.
  - paragraph:
    - emphasis: The US base salary range for this full-time position is $192,000 to $216,000 + equity + benefits. Our salary ranges are determined by role and level. Within the range, individual pay is determined by additional factors, including job-related skills, experience, and relevant education or training. Please note that the compensation details listed in US role postings reflect the base salary only, and do not include equity, or benefits.
  - paragraph:
    - strong: Why Discord?
    - text: Discord plays a uniquely important role in the future of gaming. We're a multiplatform, multigenerational and multiplayer platform that helps people deepen their friendships around games and shared interests, and helps developers build and grow their businesses. We believe games give us a way to have fun with our favorite people, whether listening to music together or grinding in competitive matches for diamond rank.
    - strong: Join us in our mission! Your future is just a click away!
  - paragraph:
    - strong: Discord is committed to inclusion and providing reasonable accommodations during the interview process.
    - text: We want you to feel set up for success, so if you are in need of reasonable accommodations, please let your recruiter know.
  - paragraph:
    - emphasis:
      - strong:
        - text: Please see our Applicant and Candidate Privacy Policy for details regarding Discord’s collection and usage of personal information relating to the application and recruitment process by clicking
        - link "HERE.":
          - /url: https://discord.com/terms/applicant-candidate-privacy-policy
