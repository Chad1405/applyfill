      - emphasis: 🚀 We’re on a mission to make money work for everyone.
  - paragraph: We’re waving goodbye to the complicated and confusing ways of traditional banking.
  - paragraph:
    - text: After starting as a prepaid card, our product offering has grown a lot in the last 10 years in the UK. As well as
