    - text: ", a"
    - link "free kids account":
      - /url: https://monzo.com/current-account/under-16s
    - text: and
    - link "credit cards":
      - /url: https://monzo.com/flex
    - text: in the UK, with more exciting things to come beyond. Our UK customers can also
    - link "save":
      - /url: https://monzo.com/savings
    - text: ","
    - link "invest":
      - /url: https://monzo.com/investments
    - text: and
    - link "combine their pensions":
      - /url: https://monzo.com/pensions
    - text: with us.
  - paragraph: With our hot coral cards and get-paid-early feature, combined with financial education on social media and our award winning customer service, we have a long history of creating magical moments for our customers!
  - paragraph: We’re not about selling products - we want to solve problems and change lives through Monzo ❤️
  - separator
  - paragraph
  - paragraph:
    - text: 📍London or Remote (UK)| | 💰 £42,500 - £55,000 ➕ incentive awards tied to your performance |
