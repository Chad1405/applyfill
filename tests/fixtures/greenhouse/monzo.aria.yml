  - heading "👤 Identity survey" [level=3]
  - paragraph: Our goal at Monzo is to make money work for everyone. To do that, working at Monzo must work for everyone. We want to create an equitable, engaged and innovative workplace which gives people from all backgrounds the support they need to thrive and grow.
  - paragraph: "Making Monzo work for everyone starts right at the beginning of every Monzonaut's journey: when they apply to work here. This demographic survey will help us better understand the people who apply to work at Monzo. It'll help us see how different groups progress through our hiring process, and where we need to make improvements to be more inclusive. If you choose to fill it out, all of the information you give us is:"
  - list:
    - listitem [level=1]:
      - strong: Voluntary
      - text: . And we've included a "prefer not to say" option for every question. It'd be helpful if you still fill out the survey even if you choose "prefer not to say" for every question, as it's useful for us to understand & record this. We won't know if you choose to fill this survey in or not.
    - listitem [level=1]:
      - strong: Anonymous to Monzo
      - text: . We can't tie your responses to you and they won't make a difference to the outcome of your application. We'll only use grouped responses for equal opportunities monitoring in our hiring process.
  - paragraph:
    - text: For more information on how we'll use this data, please read our
    - link "candidate privacy notice":
      - /url: https://monzo.com/docs/candidate-privacy-notice.pdf
    - text: .
  - paragraph: By filling out this survey, you agree that we can use your responses for the purposes we've mentioned above. You are not letting us know if we need to make any adjustments to the hiring process because of disability or neurodiversity - to do this please email us.
