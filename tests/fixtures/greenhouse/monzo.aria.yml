  - heading "⭐ Our Finance & Anaplan Centre of Excellence Team" [level=3]:
    - strong: ⭐ Our Finance & Anaplan Centre of Excellence Team
  - paragraph:
    - text: As an
    - strong: Anaplan Support Analyst
    - text: ", you will play a pivotal role in driving the success of our Anaplan platform and supporting our broader Centre of Excellence (CoE). Working directly alongside our Lead Solutions Architect, Model Builders, and the FP&A team, you will act as the key engine powering daily operations—managing change requests, facilitating user training, and getting hands-on with model building activities to enhance our financial planning ecosystem."
  - heading "🔑 You’ll play a key role by…" [level=3]:
    - strong: 🔑 You’ll play a key role by…
  - list:
    - listitem:
      - strong: "Implementing Change Requests:"
      - text: Managing, triaging, and delivering end-to-end Change Requests across our Anaplan models to ensure seamless business operations.
    - listitem:
      - strong: "Supporting Model Building:"
      - text: Collaborating closely with Lead Solutions Architect and Model Builders to assist in building, testing, and implementing new functionalities and enhancements.
    - listitem:
      - strong: "Providing Training & Supporting End Users:"
      - text: Designing and delivering engaging training sessions and documentation to upskill end-users across FP&A and Finance Business Partner teams.
    - listitem:
      - strong: "Maintaining & Optimising Models:"
      - text: Maintaining data integrity, managing user access, monitoring model performance, and troubleshooting issues as they arise.
  - heading "🤩 We’d love to hear from you if you have…" [level=3]:
    - strong: 🤩 We’d love to hear from you if you have…
  - list:
    - listitem:
      - strong: "Anaplan Expertise:"
      - text: Hands-on experience supporting and maintaining Anaplan workspaces/models (Anaplan Level 2 Model Builder certification or equivalent is highly desirable).
    - listitem:
      - strong: "Managed Change Requests & Supported Systems:"
      - text: Proven track record handling Change Requests, user support tickets, and system enhancements in a CoE or support structure.
    - listitem:
      - strong: "Model Building Skills:"
      - text: Functional understanding of Anaplan model architecture and formula building, with the ability to assist in active model development.
    - listitem:
      - strong: "Experience Training Users:"
      - text: Strong communication and facilitation skills, with a passion for training and empowering non-technical users on Anaplan functionality.
    - listitem:
      - strong: "An Understanding of Finance:"
      - text: Solid foundational understanding of financial modelling, FP&A principles, or finance workflows.
    - listitem:
      - strong: AI Tooling
      - text: ": Familiarity with AI tools, including the ability to write effective prompts. You should demonstrate curiosity for how AI can be used to improve processes and solve problems more effectively."
    - listitem:
      - strong: "Domain Experience:"
      - text: Banking or financial services experience is a bonus, but not essential! We will consider candidates from non-financial industries
  - paragraph:
    - strong: 🙌 What’s in it for you
    - strong
  - paragraph: 💰 £42,500 - £55,000 + incentive awards tied to your performance
  - paragraph: 📍 We're open to distributed working within the UK, with the expectation of working from the London office on occasional basis.
  - paragraph: ⏰ We offer flexible working hours and trust you to work enough hours to do your job well, and at times that suit you and your team.
  - paragraph: 📚 £1,000 learning budget each year to use on books, training courses and conferences.
  - paragraph: 🏡 We will set you up to work from home; all employees are given Macbooks and for fully remote workers we will provide extra support for your work-from-home setup.
  - paragraph:
    - text: ➕ Plus lots more!
    - link "Read our full list of benefits":
      - /url: https://monzo.com/careers#benefits
    - text: .
  - heading "🌈 The application journey has 3 key steps" [level=3]:
    - strong: 🌈 The application journey has 3 key steps
  - list:
    - listitem: Phone call with Recruiter (30 mins)
    - listitem: Technical video interview with Hiring Manager and FP&A Lead (60 mins)
    - listitem: Partnerships interview FP&A team (30 mins)
  - paragraph: Our average process takes around 3–4 weeks, but we will always work around your availability.
  - paragraph:
    - text: We’ll only close this role once we have enough applications for the next stage. Please submit your application as soon as possible to make sure you don’t miss out. We have some guidelines on using Artificial Intelligence (AI) to ace an application and interview at Monzo. You can read them
    - link "here":
      - /url: https://monzo.com/blog/the-ultimate-guide-on-using-ai-to-ace-an-interview-at-monzo
    - text: ". #LI-NZ1 #LI-Remote"
  - separator
  - paragraph:
    - strong: Equal opportunities for everyone
  - paragraph:
    - text: Diversity and inclusion are a priority for us and we’re making sure we have lots of support for all of our people to grow at Monzo. At Monzo, we’re embracing diversity by fostering an inclusive environment for all people to do the best work of their lives with us. This is integral to our mission of making money work for everyone. You can read more in our
    - link "blog":
      - /url: https://monzo.com/blog/diversity-and-inclusion
    - text: ", 2026"
    - link "Diversity and Inclusion Report":
      - /url: https://monzo.com/blog/our-2026-diversity-and-inclusion-report
    - text: and 2025
    - link "Gender Pay Gap Report.":
      - /url: https://monzo.com/blog/gender-pay-gap-report-2025
  - paragraph: We’re an equal opportunity employer. All applicants will be considered for employment without attention to age, ethnicity, religion, sex, sexual orientation, gender identity, family or parental status, national origin, or veteran, neurodiversity or disability status.
