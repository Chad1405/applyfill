- paragraph: Technical Program Management
- heading "Compensation" [level=2]
- list:
  - listitem: $257K – $335K • Offers Equity
- paragraph: The base pay offered may vary depending on multiple individualized factors, including market location, job-related knowledge, skills, and experience. If the role is non-exempt, overtime pay will be provided consistent with applicable laws. In addition to the salary range listed above, total compensation also includes generous equity, performance-related bonus(es) for eligible employees, and the following benefits.
- list:
  - listitem:
    - paragraph: Medical, dental, and vision insurance for you and your family, with employer contributions to Health Savings Accounts
  - listitem:
    - paragraph: Pre-tax accounts for Health FSA, Dependent Care FSA, and commuter expenses (parking and transit)
  - listitem:
    - paragraph: 401(k) retirement plan with employer match
  - listitem:
    - paragraph: Paid parental leave (up to 24 weeks for birth parents and 20 weeks for non-birthing parents), plus paid medical and caregiver leave (up to 8 weeks)
  - listitem:
    - paragraph: "Paid time off: flexible PTO for exempt employees and up to 15 days annually for non-exempt employees"
  - listitem:
    - paragraph: 13+ paid company holidays, and multiple paid coordinated company office closures throughout the year for focus and recharge, plus paid sick or safe time (1 hour per 30 hours worked, or more, as required by applicable state or local law)
  - listitem:
    - paragraph: Mental health and wellness support
  - listitem:
    - paragraph: Employer-paid basic life and disability coverage
  - listitem:
    - paragraph: Annual learning and development stipend to fuel your professional growth
  - listitem:
    - paragraph: Daily meals in our offices, and meal delivery credits as eligible
  - listitem:
    - paragraph: Relocation support for eligible employees
  - listitem:
    - paragraph: Additional taxable fringe benefits, such as charitable donation matching and wellness stipends, may also be provided.
- paragraph: More details about our benefits are available to candidates during the hiring process.
- paragraph: This role is at-will and OpenAI reserves the right to modify base pay and other compensation components at any time based on individual performance, team or company results, or market conditions.
